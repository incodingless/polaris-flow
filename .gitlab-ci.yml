# GitLab CI 发布流水线：推送 v* tag 时自动构建并发布 npm 包
#
# 与 .github/workflows/publish.yml 互不干扰：仓库托管在哪个平台，就只有对应流水线生效，两份配置可共存。
# 前置条件: GitLab → Settings → CI/CD → Variables 配置 NPM_TOKEN（protected + masked）。
# 发布到公司私服时，另将下方 NPM_REGISTRY 占位改为实际私服地址；发公网 npm 则留空。

stages:
  - deploy

publish:
  stage: deploy
  image: node:20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  variables:
    # TODO: 填公司私服地址，如 https://nexus.example.com/repository/npm-public/（发公网 npm 保持留空）
    NPM_REGISTRY: ""
  script:
    - npm install -g pnpm@10.18.3
    - pnpm install --frozen-lockfile
    # Dashboard 前端是独立的 npm 子工程（自带 lockfile，不参与 pnpm workspace），
    # `pnpm run build` 的 vite 步骤依赖它，与 publish.yml / ci.yml 保持一致。
    - npm --prefix dashboard ci
    - pnpm run build
    # 按目标 registry 生成认证；私服地址取掉协议前缀即 .npmrc 的 host 段
    - |
      if [ -n "$NPM_REGISTRY" ]; then
        echo "//${NPM_REGISTRY#https://}:_authToken=${NPM_TOKEN}" > .npmrc
        echo "registry=${NPM_REGISTRY}" >> .npmrc
        npm publish --registry "$NPM_REGISTRY"
      else
        echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        npm publish
      fi
