# 单 change 业务档案模板（仅运行态）
# 路径：.polaris/tasks/<change_id>/state.yaml
# （clarify 起草：.polaris/tasks/draft-<session_suffix>-<unix_ts>/state.yaml；
#  finalize 后 mv 到 .polaris/tasks/<change_id>/state.yaml）
#
# 叙事文档不在本目录：propose 成功后 intention / 四件套 / detailed-design / *-design.md / reviews/*
# 均在 openspec/changes/<change_id>/。本文件只维护阶段状态与 worktree 等运行态。
#
# worktree 阶段拷贝整个 .polaris/tasks/<change_id>/ 到 worktree 内同名路径，
# 主仓副本可重命名为 .polaris/tasks/<change_id>.snapshot/ 作只读快照。

change_id: ""        # 与父目录名一致；draft-* 阶段为占位，clarify finalize 回填
current_verb: idle   # idle | clarify | propose | design | plan | build | verify | delivery
current_tier: ""     # trivial | standard | critical（triage 写入）

# intention 路径生命周期：clarify 暂存 → propose Step 4.5 迁入 openspec（.polaris 不留备份）
intention:
  path: ""           # 例：.polaris/tasks/<id>/intention.md（暂存）
                     # 或 openspec/changes/<id>/intention.md（迁入后）

triage:
  tier: ""
  t1_result: ""
  t2_result: ""
  timestamp: ""

worktree:
  created_by_polaris_flow: false
  path: ""             # propose Step 1.3.A 写入
  branch: ""
  origin_repo: ""
  created_at: ""
  status: ""           # active | merged | abandoned

propose:
  status: ""           # in_progress | completed | skipped（trivial 直跳过）
  worktree_decision: ""  # created | reused | declined
  opsx_propose_status: ""  # ok | failed | n/a
  finished_at: ""

design:
  status: ""           # in_progress | completed
  path: ""             # 完成后：openspec/changes/<change_id>/detailed-design.md
  review_report: ""    # openspec/changes/<change_id>/reviews/design-review-report.md
                       # 或 skipped:<reason>
  draft_dir: ""        # 历史字段；目标态 design 不再用 .polaris draft 目录写设计文档

plan:
  status: ""
  tdd_policy: ""       # prefer_tdd | require_tdd | prefer_direct
  tasks_path: ""       # openspec/changes/<change_id>/tasks.md
  review_report: ""    # openspec/changes/<change_id>/reviews/plan-review-report.md

review:
  status: ""
  plan_review_status: ""
  constitution_compliance: ""

build:
  status: ""
  current_task: ""
  total_tasks: 0
  completed_tasks: 0

verify:
  constitution_valid: false
  scorer_results: {}
  overall_score: 0
  blocked: false
  verification_report: ""  # openspec/changes/<change_id>/reviews/verify-report.md

delivery:
  status: ""
  merge_strategy: ""
  finished_at: ""
  harness_sync: ""   # synced | partial_failure | skipped_no_source | skipped_worktree_retained | deferred_archive_conflict | n/a
  archive_dir: ""    # 例：.polaris/archive/<change_id>（运行态快照；叙事随 openspec archive）
  archive: ""        # archived | deferred | skipped | failed
  archive_path: ""
  archive_error: ""

deepread:
  last_triggered: ""
  pending_file: ""
  action: halt_and_wait
