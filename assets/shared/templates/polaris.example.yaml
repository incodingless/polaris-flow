version: "0.1.0"

# 安装时间
install-time: "2026-06-25T02:05:29.066Z"

# 控制台端口号
dashboard-port: 19080

# 插件信息
plugins:
  openspec: 0.4.0
  superpowers: 6.0.3
  codegraph: 0.1.0

supported-platforms:
  - trae
  - trae-cn
  - qoder
  - claude

# 可用模型列表
models:
  high: 
  - GLM5.2
  - Doubao-Seed-2.1-Pro
  - Doubao-Seed-2.1-Turbo
  - Qwen3.7-Plus
  medium:
  - Kimi-K2.7-Code
  - MiniMax-M3
  - DeepSeek-V4-Pro
  low:
  - DeepSeek-V4-Flash

# 组件安装通道（polaris init 安装 OpenSpec / Superpowers / Codegraph 时使用）
# 三条通道按序尝试：npm → git 镜像 clone → 本地源码目录；留空 = 使用默认行为
install:
  # GitHub 镜像基址（git clone 通道）；留空 = 直连 github.com
  github-mirror: ""
  # npm registry 覆盖（npm 通道）；留空 = 使用机器默认（~/.npmrc）
  npm-registry: ""
  # 各组件本机源码目录（本地目录通道）；留空 = 跳过该通道
  local-paths:
    openspec: ""
    superpowers: ""
    codegraph: ""