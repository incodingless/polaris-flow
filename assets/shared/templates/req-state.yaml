# 单 change 业务档案模板（仅运行态）
# 路径：.polaris/tasks/<change_id>/state.yaml
# （clarify 起草：.polaris/tasks/draft-<session_suffix>-<unix_ts>/state.yaml；
#  finalize 后 mv 到 .polaris/tasks/<change_id>/state.yaml）
#
# 叙事文档不在本目录：propose 成功后 intention / 四件套 / detailed-design / *-design.md / reviews/*
# 均在 openspec/changes/<change_id>/。本文件只维护阶段状态与 worktree 等运行态。
#
# worktree 阶段拷贝整个 .polaris/tasks/<change_id>/ 到 worktree 内同名路径，
# 主仓副本可重命名为 .polaris/tasks/<change_id>.snapshot/ 作只读快照。

####################
# 基础配置 
####################
# 语言
# 可选值: en-英文 | zh-中文
language: "zh"

# 安装时间
install-time: "2026-06-25T02:05:29.066Z"

# 仓库根目录
main-repo-root: "<project_root>"

# 工作树目录
worktree-dir: "<project_root>/.worktrees"

####################
# 运行配置 
####################
# 变更ID
# 与父目录名一致；draft-* 阶段为占位，clarify finalize 回填
change_id: ""

# 阶段
# 可选值: idle-空闲 | clarify-澄清 | propose-提案 | design-设计 | plan-计划 | build-构建 | verify-验证 | delivery-交付
phase: idle

# 制品审查模式
# 可选值: after_all -全部生成后审查 | per_batch -每批次生成后审查
artifact_review_mode: "per_batch"
# 制品审查最大轮次，默认5轮
artifact_max_round: 5

# 验证模式
# 可选值: light-轻量验证 | heavy-重量验证
verify_mode: "light"

# 自动过渡
auto_transition: true

# 隔离模式
# 可选值: worktree-工作树 | branch-分支
isolation: "worktree"
 
# 工作树信息
worktree:
  # 是否由 polaris-flow 创建
  created_by_polaris_flow: false
  # 工作树路径
  path: ""
  # 工作树分支
  branch: ""
  # 工作树源仓库
  origin_repo: ""
  # 工作树状态
  status: ""     
  # 工作树创建时间
  created_at: ""

####################
# 产物信息 （运行态产物）
####################

######## discovery阶段 #############
discovery:
  # 状态
  # 可选值: in_progress-进行中 | completed-完成 | skipped-跳过（trivial 直跳过）
  status: ""
  # 工作树决策
  # 可选值: created-创建 | reused-重用 | declined-拒绝
  worktree_decision: ""
  # 提案状态
  # 可选值: ok-成功 | failed-失败 | n/a-未执行
  opsx_propose_status: ""
  # 审查轮次
  # 可选值: 0-第一轮 | 1-第二轮 | 2-第三轮 | ...
  review_round: 0
  review_log_file: "openspec/changes/<change_id>/review-log.md"
  # 审查报告
  # 可选值: openspec/changes/<change_id>/reviews/propose-review-report.md 或 skipped:<reason>
  review_report: ""
  # 外部声音
  # 可选值: ran-运行 | skipped:<reason>-跳过 | not_run:<reason>-未运行
  outside_voice: ""
  # 外部声音报告
  # 可选值: openspec/changes/<change_id>/reviews/openspec-review-report.md
  outside_voice_report: ""
  # 完成时间
  # 格式: YYYY-MM-DDTHH:MM:SS.SSSZ
  finished_at: ""

######## draft阶段 #############
draft:
  # 状态
  # 可选值: in_progress-进行中 | completed-完成 | skipped-跳过（trivial 直跳过）
  status: ""
  # 路径
  # 可选值: openspec/changes/<change_id>/detailed-design.md
  path: ""
  # 审查报告
  # 可选值: openspec/changes/<change_id>/reviews/design-review-report.md 或 skipped:<reason>
  review_report: ""
  # 外部声音
  # 可选值: ran-运行 | skipped:<reason>-跳过 | not_run:<reason>-未运行
  outside_voice: ""
  outside_voice_report: ""
  # 草稿目录
  # 可选值: .polaris/draft/<change_id>
  draft_dir: ""

######## build阶段 #############
build:
  # 状态
  # 可选值: in_progress-进行中 | completed-完成 | skipped-跳过（trivial 直跳过）
  status: ""
  # TDD 策略
  # 可选值: prefer_tdd-优先TDD | require_tdd-强制TDD | prefer_direct-优先直接
  tdd_policy: ""
  # 任务路径
  # 可选值: openspec/changes/<change_id>/tasks.md
  tasks_path: ""
  # 审查报告
  # 可选值: openspec/changes/<change_id>/reviews/plan-review-report.md
  review_report: ""
  # 外部声音
  # 可选值: ran-运行 | skipped:<reason>-跳过 | not_run:<reason>-未运行
  outside_voice: ""
  # 外部声音报告
  # 可选值: openspec/changes/<change_id>/reviews/openspec-review-report.md
  outside_voice_report: ""

####### 审查信息 #############
review:
  # 状态
  # 可选值: in_progress-进行中 | completed-完成 | skipped-跳过（trivial 直跳过）
  status: ""
  # 计划审查状态
  # 可选值: in_progress-进行中 | completed-完成 | skipped-跳过（trivial 直跳过）
  plan_review_status: ""
  # 宪法合规
  # 可选值: true-合规 | false-不合规
  constitution_compliance: ""
  # 审查报告
  # 可选值: openspec/changes/<change_id>/reviews/review-report.md
  review_report: ""
  # 外部声音
  # 可选值: ran-运行 | skipped:<reason>-跳过 | not_run:<reason>-未运行
  outside_voice: ""
  # 外部声音报告
  # 可选值: openspec/changes/<change_id>/reviews/openspec-review-report.md
  outside_voice_report: ""

####### 交付信息 #############
delivery:
  # 状态
  # 可选值: in_progress-进行中 | completed-完成 | skipped-跳过（trivial 直跳过）
  status: ""
  # 合并策略
  # 可选值: merge-合并 | rebase-重基 | squash-压缩
  merge_strategy: ""
  # 完成时间
  # 格式: YYYY-MM-DDTHH:MM:SS.SSSZ
  finished_at: ""
  # 同步状态
  # 可选值: synced-同步 | partial_failure-部分失败 | skipped_no_source-跳过无源 | skipped_worktree_retained-跳过工作树保留 | deferred_archive_conflict-延迟归档冲突 | n/a-未执行
  harness_sync: ""
  # 归档目录
  # 可选值: .polaris/archive/<change_id>（运行态快照；叙事随 openspec archive）
  archive_dir: ""
  # 归档状态
  # 可选值: archived-归档 | deferred-延迟 | skipped-跳过 | failed-失败
  archive: ""
  # 归档路径
  # 可选值: openspec/changes/<change_id>/archive.md
  archive_path: ""
  # 归档错误
  # 可选值: 错误信息
  archive_error: ""