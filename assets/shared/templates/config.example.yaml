####################
# 基础配置 
####################
# 语言
# 可选值: en-英文 | zh-中文
language: "zh"

# 平台
# 可选值: trae-trae | claude-claude | qoder-qoder | trae-cn-trae中文版
platforms:
  - "trae-cn"

# 范围
# 可选值: global-全局 | project-项目
scope: "project"

# 安装时间
install-time: "2026-06-25T02:05:29.066Z"

# 仓库根目录
main-repo-root: "<project_root>"

# 工作树目录
worktree-dir: "<project_root>/.worktrees"

# 布局配置
layout:

  # 工作树目录
  worktree: "<project_root>/.worktrees"

  # openspec目录
  openspec: "<project_root>/openspec"

  # 任务目录
  tasks: 
    root: "<project_root>/.polaris/tasks"
    draft: "draft"

  ##### 文档目录 #####
  docs:
    root: "<project_root>/docs"
    prd: "prd"
    prototype: "prototype"
    architecture: "architecture"
    design: "design"
    testcases: "testcases"
    bugfix: "trouble-shooting"
    refactoring: "refactoring"

# 模型配置
model:
  # 提案模型
  propose: GLM5.2
  # 编码模型
  code: Doubao-Seed-2.1-Pro
  # 审查模型
  review: DeepSeek-V4-Flash
  # 挑战模型
  challenger: DeepSeek-V4-Pro

####################
# 运行配置 
####################
# 协作模式
# 可选值: solo-单人协作 | team-多人协作
kind: "solo"

# 上下文压缩
# 可选值: off-关闭 | beta-开启
context-compression: beta

# 自动衔接下一阶段
# 可选值: auto-自动衔接（须 context-compression 非 off）| off-手动衔接
# 出厂默认 off：每个技能完成后停下，提示新开会话并输入下一技能名
auto-transition: off

# 宿主形态（影响「压缩上下文」的提示语：IDE 点按钮 / CLI 输入斜杠命令）
# 可选值: ide-IDE 面板 | cli-命令行
# 留空（""）= 未声明 → 提示语同时给出两种形式（不猜，见设计文档 §5.6.3）
host-form: ""

####################
# 高级配置 
####################
# 评分配置
scorer:
  # 留空使用默认模型；team 模式可指定评分模型
  model: ""
  # 权重配置
  weights:
    # 审计违规率
    audit-violation-rate: 1.0
    # 宪法违规数量
    constitution-violation-count: 1.0
    # 测试覆盖率
    test-coverage: 1.0
    # 代码复杂度
    complexity: 1.0
    # 文档同步
    doc-sync: 1.0

# 质量评分阈值配置
thresholds:
  solo:
    warn_below: 60
  team:
    block_below: 70

# 分类配置
triage:
  mechanical_script: "hooks/triage-t1.sh"
  sensitive_keywords_file: ".polaris/keywords/critical.txt"
  default_tier_when_unclear: "standard"

tiers:
  trivial:
    path: ["build", "ship"]
  standard:
    path: ["design", "lock", "build", "audit", "ship"]
  critical:
    path: ["design", "lock", "challenge", "build", "audit", "ship"]

# 深度阅读配置
deepread:
  # 默认行为: halt_and_wait | notify_and_continue
  default_action: "halt_and_wait"
  # 模板路径
  template_path: "templates/deepread-template.html"
  # 输出目录
  output_dir: ".polaris/deepreads"
  # 令牌阈值
  token_threshold: 500

# 宪法配置
constitution:
  required: false
  path: "openspec/memory/constitution.md"

req_naming:
  prefix_rule: derived        # derived | fixed | manual
  prefix_pattern: "{DEPT}-{MODULE}"   # 仅 fixed 使用；占位符运行时求解
  conflict_policy: extend

# 构建 / 测试执行配置（verify 阶段使用；命令由「探测 → 展示 → 人工确认」回路落盘，不靠手填）
test:
  # 命令槽（探测 / 人工确认后落盘；留空 = 该槽不可用 → 对应步记 No-Verification）
  #   build       编译 / 构建闸门（verify Step 3；模式无关，不过即停）
  #   unit        单元测试（Step 6；总是跑）
  #   contract    契约测试（Step 10；有契约源才跑，静态校验无需真实环境）
  #   integration 集成测试（Step 11；改动跨模块边界 / DAO / 外部接口才跑）
  #   smoke       主干功能 / E2E（Step 12；verify_mode=full 且槽位存在才跑）
  commands:
    build: ""             # 例：npm run build / mvn -B package -DskipTests / gradlew assemble
    unit: ""              # 例：mvn -B test（只跑单测，不含集成）
    contract: ""          # 例：npm run test:contract / pytest tests/contract
    integration: ""       # 例：mvn -B verify（Failsafe *IT.java）
    smoke: ""             # 例：make smoke（须自带环境准备）
  # 来源标记（探测→确认回路的产物）
  source: probed          # probed | confirmed | corrected
  confirmed_at: ""
  # 超时（秒）：按框架默认表，可覆盖
  # 首次超时自动放宽 1 次（冷缓存 / 依赖首次下载）；仍超时按「无结果摘要」处置
  timeout:
    build: 600            # 首次编译常要拉依赖 / 走冷缓存
    unit: 300             # JVM 生态（Maven / Gradle）用 600
    contract: 300
    integration: 600
    smoke: 900
  # 失败测试的处置：retry_and_mark = 重试 1 次 + 报告强制标注「首次失败 · 重试通过」
  # 从严可改回 fail_on_flake（不重试，更贴合「无法失败的测试比没有测试更糟」）
  flaky_policy: retry_and_mark    # retry_and_mark | fail_on_flake | retry_once
  # 探测不到测试入口时的处置：by_mode = light 放行 + 声明 / full 阻断
  # 只作用于测试槽（unit / contract / integration / smoke）；build 槽探不到一律记 No-Verification、不阻断
  no_framework_policy: by_mode    # by_mode | block | pass
  # 基线红名单来源（默认全绿才放行；此处仅在项目 CI 本身有红时启用）
  # 只作用于单元轨 —— 「存量单测红名单」是单元级概念
  baseline:
    command: ""           # 项目提供的取红名单命令
    file: ""              # 或直接指向 CI artifact