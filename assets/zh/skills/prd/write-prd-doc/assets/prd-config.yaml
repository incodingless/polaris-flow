# 产品需求技能配置文件 (prd-config)
# 相对路径相对于本文件所在目录解析；缺失目录会在加载时自动创建。

workspace: ./requirements-workspace       # 文档生成位置（每个需求独立子目录）
archive: ./requirements-archive            # 归档位置（终稿复制于此）
requirement_library: ./requirements-library  # 需求文档库（clarify 阶段查阅，可选）
language: zh-CN                            # 文档默认语言
generate_prototype: false                 # 是否自动执行原型阶段
prototype_format: html                    # 原型格式（html）
config_version: 1
