# 基础配置
language: "zh-CN"  #语言: en | zh-CN
platform:          # 平台: trae | claude | qoder
  - "trae" 
  
scope: "project" # 范围: global | project
install-time: "2026-06-25T02:05:29.066Z" # 安装时间

# 插件信息
plugins:
  openspec: 0.4.0
  superpowers: 6.0.3
  codegraph: 0.1.0

# 主要目录
main-repo-root: "<project_root>"
plugin-root: "<project_root>/<platform>/skills/polaris-flow"
worktree-dir: "<project_root>/.worktrees"

# 运行配置
kind: "solo"  # 协作模式: solo | team
workflow: sdd  # 工作流类型: sdd | tweak | bugfix | full
phase: clarify  # 阶段: clarify | design | build | audit | ship
verify_mode: "light"  # 验证模式: light | heavy
auto_transition: true  # 自动过渡
isolation: "worktree" # 隔离模式: worktree | branch 
context-compression: off  # 上下文压缩: off | beta
review-mode: standard  # 审查模式: standard | thorough
build-mode: tdd  # 开发模式: tdd | bdd

# 模型配置
model:
  propose: GLM5.2
  code: Doubao-Seed-2.1-Pro
  review: DeepSeek-V4-Flash
  challenger: DeepSeek-V4-Pro
  default: GLM5.2

# 评分配置
scorer:
  # 留空使用默认模型；team 模式可指定评分模型
  model: ""  
  weights:
    audit-violation-rate: 1.0
    constitution-violation-count: 1.0
    test-coverage: 1.0
    complexity: 1.0
    doc-sync: 1.0

# 质量评分阈值配置
thresholds:
  solo:
    warn_below: 60
  team:
    block_below: 70

# 分类配置
triage:
  mechanical_script: "hooks/triage-t1.sh"
  sensitive_keywords_file: ".polaris/keywords/critical.txt"
  default_tier_when_unclear: "standard"

tiers:
  trivial:
    path: ["build", "ship"]
  standard:
    path: ["design", "lock", "build", "audit", "ship"]
  critical:
    path: ["design", "lock", "challenge", "build", "audit", "ship"]

# 深度阅读配置
deepread:
  default_action: "halt_and_wait"  # halt_and_wait | notify_and_continue
  template_path: "templates/deepread-template.html"
  output_dir: ".polaris/deepreads"
  token_threshold: 500

# 宪法配置
constitution:
  required: false
  path: "openspec/memory/constitution.md"